<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חתימות — פעולות בסוויפ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Design-system tokens from the client's library. The brand font is
     proprietary; Heebo stands in for the public prototype. */
  :root{
    --color-primary:#0066ff;
    --color-primary-press:#0052cc;
    --color-ink:#1d1d20;
    --color-ink-muted:#5f6470;
    --color-surface:#ffffff;
    --color-ground:#f4f6fa;
    --color-edge:#e6e9f0;
    --color-tag:#eaf1fd;
    --color-danger:#ffffff;
    --radius-card:14px;
    --shadow-card:0 1px 4px rgba(29,29,32,.08);
    font-family:'Heebo',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--color-ground);color:var(--color-ink);max-width:420px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
  header{background:var(--color-surface);padding:14px 16px 0;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--color-edge)}
  .acct{display:flex;justify-content:flex-start;align-items:center;gap:6px;font-size:15px;font-weight:500}
  .acct small{display:block;font-weight:400;color:var(--color-ink-muted);font-size:12px}
  .tabs{display:flex;gap:22px;margin-top:14px;font-size:15px}
  .tab{padding:0 2px 10px;color:var(--color-ink-muted);position:relative}
  .tab.on{color:var(--color-primary);font-weight:700;box-shadow:inset 0 -2.5px 0 var(--color-primary)}
  .badge{background:var(--color-primary);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-inline-start:4px;font-weight:500}
  .listbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:13.5px;color:var(--color-ink-muted)}
  main{padding:0 12px 24px;display:flex;flex-direction:column;gap:12px}
  .cardwrap{position:relative;border-radius:var(--radius-card);overflow:hidden}
  /* ltr so the sign action sits at the LEFT edge — the side the card
     exposes, matching the mid-swipe frames on the Transitions page */
  .actions{position:absolute;inset:0;display:flex;flex-direction:row;direction:ltr}
  .act{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-size:14px;font-weight:500;transition:flex .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
  .act.sign{background:var(--color-primary);color:#fff}
  .act.reject{background:#fff;color:var(--color-ink);border-inline-start:1px solid var(--color-edge)}
  /* full-swipe: the sign action takes over the surface, the reject fades (spec) */
  .cardwrap.commit .act.sign{flex:20}
  .cardwrap.commit .act.reject{flex:.001;opacity:0}
  .card{position:relative;background:var(--color-surface);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:0 0 14px;touch-action:pan-y;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .card.drag{transition:none}
  .cardhead{display:flex;justify-content:space-between;align-items:center;background:var(--color-tag);border-radius:var(--radius-card) var(--radius-card) 0 0;padding:9px 14px;font-size:13.5px}
  .cardhead .who{display:flex;align-items:center;gap:8px;font-weight:500}
  .chk{width:18px;height:18px;border:1.5px solid #c3c9d4;border-radius:4px;background:#fff}
  .quota{color:var(--color-ink-muted)}
  .row{display:flex;justify-content:space-between;padding:7px 14px;font-size:13.5px}
  .row .k{color:var(--color-ink-muted)}
  .amount{font-size:19px;font-weight:700;padding:2px 14px 0}
  .done{background:var(--color-surface);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:16px;display:flex;align-items:center;gap:10px;font-weight:500;color:var(--color-primary)}
  .done svg{flex-shrink:0}
  .hint{padding:14px 16px;font-size:12.5px;color:var(--color-ink-muted);text-align:center}
</style>
</head>
<body>
<header>
  <div class="acct">כל החשבונות (7) <small>הוראות מכל החשבונות</small></div>
  <nav class="tabs">
    <span class="tab on">לחתימה<span class="badge" id="badge">3</span></span>
    <span class="tab">סטטוס</span>
    <span class="tab">קבצי סחב״ל</span>
  </nav>
</header>
<div class="listbar"><span>☐ בחר הכל</span><span>מיון וסינון</span></div>
<main id="list"></main>
<p class="hint">גררו כרטיסייה הצידה — גרירה חלקית חושפת חתימה / סירוב, גרירה מלאה חותמת</p>

<script>
const DATA = [
  { type:'העברה לחשבונות אחרים', who:'רנה לוי', date:'26.07.22', amount:'12,000.00', debit:'11-188-11002227', credit:'11-188-11002227', quota:'חתמו 1/3' },
  { type:'העברה לחשבונות אחרים', who:'שי אזיזה', date:'26.07.22', amount:'8,540.00', debit:'11-188-11002227', credit:'11-231-40018812', quota:'חתמו 2/3' },
  { type:'הפקדת שיקים', who:'דנה כהן', date:'25.07.22', amount:'3,120.50', debit:'11-188-11002227', credit:'—', quota:'חתמו 1/2' },
];
const list = document.getElementById('list');
const badge = document.getElementById('badge');

function render(item){
  const wrap = document.createElement('div');
  wrap.className = 'cardwrap';
  wrap.innerHTML = `
    <div class="actions">
      <div class="act sign">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M6 16l8.5-8.5a2.1 2.1 0 0 1 3 3L9 19l-4 1z"/></svg>
        חתימה
      </div>
      <div class="act reject">✕ סירוב</div>
    </div>
    <article class="card">
      <div class="cardhead"><span class="who"><span class="chk"></span>${item.type}</span><span class="quota">${item.quota}</span></div>
      <div class="row"><span>פרטי הזנה ${item.date}, ${item.who}</span></div>
      <div class="amount">₪ ${item.amount}</div>
      <div class="row"><span class="k">חשבון לחיוב</span><span>${item.debit}</span></div>
      <div class="row"><span class="k">חשבון לזיכוי</span><span>${item.credit}</span></div>
    </article>`;
  list.appendChild(wrap);
  attachSwipe(wrap, item);
}

/* Swipe spec from the Transitions page: partial drag reveals both actions;
   continuing the drag makes the sign button rise over reject and take the
   whole surface; releasing there commits the signature. RTL: reveal is a
   POSITIVE translateX (dragging toward the left edge). */
function attachSwipe(wrap, item){
  const card = wrap.querySelector('.card');
  const REVEAL = 148, COMMIT = 250;
  let x0 = null, dx = 0, open = 0;

  const set = v => card.style.transform = `translateX(${v}px)`;

  card.addEventListener('pointerdown', e => { x0 = e.clientX; card.classList.add('drag'); card.setPointerCapture(e.pointerId); });
  card.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = Math.max(0, (e.clientX - x0) + open);
    wrap.classList.toggle('commit', dx > COMMIT);
    set(Math.min(dx, 320));
  });
  card.addEventListener('pointerup', () => {
    card.classList.remove('drag');
    if (dx > COMMIT) return sign(wrap, item);
    open = dx > REVEAL / 2 ? REVEAL : 0;
    wrap.classList.remove('commit');
    set(open);
    x0 = null; dx = 0;
  });
  wrap.querySelector('.act.sign').addEventListener('click', () => sign(wrap, item));
  wrap.querySelector('.act.reject').addEventListener('click', () => { open = 0; set(0); });
}

function sign(wrap, item){
  const card = wrap.querySelector('.card');
  wrap.classList.add('commit');
  card.style.transform = 'translateX(110%)';
  setTimeout(() => {
    wrap.outerHTML = `<div class="done">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>
      ההוראה נחתמה — ${item.type}, ₪ ${item.amount}
    </div>`;
    badge.textContent = Math.max(0, Number(badge.textContent) - 1);
  }, 300);
}

DATA.forEach(render);
</script>
</body>
</html>
