<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בחירת חשבון — שדה חיפוש והתנהגות בחירה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-primary:#0066ff;
    --color-ink:#1d1d20;
    --color-ink-muted:#5f6470;
    --color-surface:#ffffff;
    --color-scrim:rgba(29,29,32,.45);
    --color-chip:#f2f6fb;
    --color-selected:#eaf1fd;
    --color-edge:#e6e9f0;
    font-family:'Heebo',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  body{background:#dfe5ee;max-width:420px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;color:var(--color-ink)}
  .app-behind{filter:blur(2px);opacity:.55;padding:18px 16px;font-size:14px}
  .scrim{position:fixed;inset:0;background:var(--color-scrim);opacity:0;transition:opacity .3s;pointer-events:none}
  .sheet{position:fixed;bottom:0;inset-inline:0;max-width:420px;margin:0 auto;background:var(--color-surface);border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-height:88vh;display:flex;flex-direction:column}
  body.open .scrim{opacity:1}
  body.open .sheet{transform:none}
  .grab{width:44px;height:4px;border-radius:2px;background:var(--color-edge);margin:0 auto 14px}
  .sheethead{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;margin-bottom:14px}
  .sheethead .edit{color:var(--color-ink-muted);font-size:15px}
  .search{display:flex;align-items:center;gap:8px;background:var(--color-chip);border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .search input{border:0;background:none;font:inherit;font-size:14px;width:100%;outline:none;color:var(--color-ink)}
  .search svg{color:var(--color-ink-muted);flex-shrink:0}
  .all{display:flex;justify-content:space-between;align-items:center;background:var(--color-selected);border-radius:10px;padding:12px 14px;font-size:14.5px;color:var(--color-primary);font-weight:500;cursor:pointer;margin-bottom:6px}
  ul{list-style:none;overflow-y:auto;flex:1}
  li{display:flex;justify-content:space-between;align-items:center;padding:13px 6px;font-size:14.5px;border-bottom:1px solid transparent;cursor:pointer;border-radius:10px;transition:background .15s;animation:rise .2s both}
  li:hover{background:var(--color-chip)}
  li .right{display:flex;align-items:center;gap:10px}
  .radio{width:18px;height:18px;border:1.5px solid #c3c9d4;border-radius:50%;position:relative;transition:border-color .15s;flex-shrink:0}
  li.on .radio{border-color:var(--color-primary)}
  li.on .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--color-primary);animation:pop .18s}
  .num{color:var(--color-ink-muted);direction:ltr}
  .star{color:#c3c9d4;cursor:pointer;font-size:17px;transition:transform .15s,color .15s;background:none;border:0;padding:0 4px}
  .star.on{color:var(--color-primary);transform:scale(1.15)}
  .empty{padding:28px 0;text-align:center;color:var(--color-ink-muted);font-size:13.5px;display:none}
  .foot{display:flex;justify-content:center;padding-top:12px;border-top:1px solid var(--color-edge);margin-top:6px}
  .foot span{color:var(--color-primary);font-weight:500;font-size:14.5px}
  @keyframes pop{from{transform:scale(.4)}}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
</style>
</head>
<body>
<div class="app-behind">
  <p style="font-weight:700;font-size:16px">תמונת מצב</p>
  <p style="margin-top:6px;color:var(--color-ink-muted)">יתרה כוללת בכל החשבונות</p>
  <p style="font-size:24px;font-weight:700;margin-top:2px">₪ 1,254,301.44</p>
</div>
<div class="scrim"></div>

<section class="sheet" aria-label="בחירת חשבון">
  <div class="grab"></div>
  <div class="sheethead"><span>בחירת חשבון</span><span class="edit">✎</span></div>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" placeholder="חיפוש לפי שם חשבון או מספר חשבון" autocomplete="off">
  </label>
  <div class="all" id="all"><span>כל החשבונות</span><span>4 חשבונות ◉</span></div>
  <ul id="list"></ul>
  <p class="empty" id="empty">לא נמצא חשבון תואם</p>
  <div class="foot"><span>◫ התנתקות</span></div>
</section>

<script>
/* Field behavior + selection, from the Transitions page: typing filters the
   list live; picking a row animates the radio and swaps the selection; the
   star pins a favorite to the top. All data is placeholder. */
const ACCOUNTS = [
  { name:'עיסקי',  num:'133-117773/21', fav:true  },
  { name:'עיסקי',  num:'133-117774/22', fav:false },
  { name:'שכירות', num:'133-201448/03', fav:false },
  { name:'ספקים',  num:'133-560091/17', fav:false },
];
let selected = -1;
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const all = document.getElementById('all');

function render(filter=''){
  const q = filter.trim();
  const rows = ACCOUNTS
    .map((a,i)=>({ ...a, i }))
    .filter(a => !q || a.name.includes(q) || a.num.includes(q))
    .sort((a,b)=> Number(b.fav) - Number(a.fav));
  list.innerHTML = rows.map(a => `
    <li data-i="${a.i}" class="${selected===a.i?'on':''}" style="animation-delay:${rows.indexOf(a)*30}ms">
      <span class="right"><span class="radio"></span>${a.name}</span>
      <span class="right"><span class="num">${a.num}</span><button class="star ${a.fav?'on':''}" data-fav="${a.i}" aria-label="חשבון מועדף">★</button></span>
    </li>`).join('');
  empty.style.display = rows.length ? 'none' : 'block';
  list.querySelectorAll('li').forEach(li => li.addEventListener('click', e => {
    if (e.target.closest('.star')) return;
    selected = Number(li.dataset.i);
    all.style.opacity = .55;
    render(document.getElementById('q').value);
  }));
  list.querySelectorAll('.star').forEach(st => st.addEventListener('click', () => {
    const a = ACCOUNTS[st.dataset.fav];
    a.fav = !a.fav;
    render(document.getElementById('q').value);
  }));
}
document.getElementById('q').addEventListener('input', e => render(e.target.value));
all.addEventListener('click', () => { selected = -1; all.style.opacity = 1; render(document.getElementById('q').value); });

render();
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('open')));
</script>
</body>
</html>
